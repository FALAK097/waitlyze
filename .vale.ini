StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, link
SkippedScopes = script, style, pre, figure, text.frontmatter

Packages = Google, Readability, proselint

Vocab = Waitlyze

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Readability, Waitlyze


# Google style adjustments for developer documentation
Google.Passive = warning
Google.We = suggestion
Google.WordList = warning
Google.Parens = suggestion
Google.Contractions = suggestion
Google.Headings = warning
Google.Acronyms = suggestion
Google.Quotes = suggestion
Google.Will = suggestion
Google.FirstPerson = suggestion
Google.Semicolons = suggestion
Google.LyHyphens = suggestion
Google.Latin = suggestion
Google.Units = suggestion

# Readability adjustments (disable overly strict syllable/metric noise on technical docs)
Readability.Polysyllables = NO
Readability.FleschReadingEase = suggestion
Readability.FleschKincaid = suggestion
Readability.LIX = NO
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.GunningFog = NO
Readability.SMOG = NO

# Ignore frontmatter, MDX imports, exports, multiline JSX components, code tokens, and link URLs
BlockIgnores = (?s)(^---[^\n]*\n.*?\n---(?:\n|$)), (?s)(^import\s+.*?;\s*$), (?s)(^export\s+.*?;\s*$), (?s)(<[A-Z][a-zA-Z0-9]*\b.*?\/>)
TokenIgnores = (\{#.*?\}), (`[^`]+`), (icon:\s*[a-z0-9-]+), (\bx-waitlyze-[a-z-]+\b), (\(https?://[^\)]+\)), (\(/?[a-zA-Z0-9_\-\.\/]+\)), ([a-z0-9]+(-[a-z0-9]+)+), ([a-z]+[A-Z0-9][a-zA-Z0-9]*)
