name = "waitlyze-outbox-dispatch"
main = "src/index.js"
compatibility_date = "2026-10-01"

[limits]
cpu_ms = 10000

# Runs every 15 minutes: drains the email outbox and pending webhook
# deliveries via the app's internal route. Adjust as needed, e.g.
# "*/30 * * * *" for every thirty minutes, then redeploy.
[triggers]
crons = ["*/15 * * * *"]

