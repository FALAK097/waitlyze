name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit

  build-and-smoke:
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: waitlyze_fixture
          POSTGRES_PASSWORD: waitlyze_fixture
          POSTGRES_DB: waitlyze_workspace_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U waitlyze_fixture -d waitlyze_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKSPACE_TEST_DATABASE_URL: postgresql://waitlyze_fixture:waitlyze_fixture@127.0.0.1:5432/waitlyze_workspace_test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/with-test-env.mjs node node_modules/prisma/build/index.js migrate deploy
      - run: pnpm build:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:database
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
