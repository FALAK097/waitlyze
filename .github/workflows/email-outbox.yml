name: Email outbox dispatch

# Drives retries for queued emails (signup verification, broadcasts, automations).
# Plain HTTP so it works the same on Vercel or Cloudflare.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: email-outbox
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch pending outbox events
        env:
          OUTBOX_DISPATCH_SECRET: ${{ secrets.OUTBOX_DISPATCH_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 240 \
            -X POST "https://waitlyze.falakgala.dev/api/internal/email-outbox" \
            -H "Authorization: Bearer ${OUTBOX_DISPATCH_SECRET}" \
            -H "Content-Type: application/json"
