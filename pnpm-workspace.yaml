overrides:
  kysely: 0.28.2

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - core-js
  - prisma
  - sharp

allowBuilds:
  '@prisma/engines': set this to true or false
  core-js: set this to true or false
  prisma: set this to true or false
  sharp: set this to true or false

# Security hardening
minimumReleaseAge: 10080
trustPolicy:
  no-downgrade: true
